databases:
  - name: indobid-db
    databaseName: indobid
    user: indobid_user
    plan: free
    region: ohio

services:
  - type: web
    name: indobid-flask
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: indobid-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ROUND_DURATION_SECONDS
        value: "3600"
      - key: LISTING_PRICE
        value: "2.0"
      - key: CURRENCY
        value: "USD"
      - key: ENTRY_FEE_INR
        value: "49.0"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: "admin@indobid.lol"
      - key: ADMIN_PASSWORD
        generateValue: true
