databases:
  - name: indobid-db
    databaseName: indobid
    user: indobid_user
    plan: free
    region: ohio

services:
  - type: web
    name: indobid
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: indobid-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ROUND_DURATION_SECONDS
        value: "3600"
      - key: ADMIN_EMAIL
        value: "admin@indobid.lol"
      - key: ADMIN_PASSWORD
        generateValue: true
