{% extends "base.html" %}

{% block title %}Admin Sign In — indobid.lol{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16 sm:py-24">
  <div class="saas-card rounded-2xl p-8 border border-slate-200">
    
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-purple-50 border border-purple-200 text-purple-700 flex items-center justify-center mx-auto mb-4 text-xl">
        🔐
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Admin Sign In</h1>
      <p class="text-xs text-slate-500 mt-1">
        Restricted control center. Normal visitors never see this.
      </p>
    </div>

    <form method="POST" action="{{ url_for('admin.login') }}" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
          Admin Email
        </label>
        <input type="email" id="email" name="email" required placeholder="admin@indobid.lol"
          class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-purple-600 focus:ring-1 focus:ring-purple-600 transition-colors text-sm">
      </div>

      <div>
        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
          Password
        </label>
        <input type="password" id="password" name="password" required placeholder="••••••••••••"
          class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-purple-600 focus:ring-1 focus:ring-purple-600 transition-colors text-sm">
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full btn-primary py-2.5 rounded-xl font-bold text-sm tracking-wide">
          Access Dashboard
        </button>
      </div>
    </form>

    <div class="text-center mt-6 pt-4 border-t border-slate-100">
      <a href="{{ url_for('main.index') }}" class="text-xs text-slate-500 hover:text-purple-600 transition-colors">
        ← Back to Homepage
      </a>
    </div>

  </div>
</div>
{% endblock %}
