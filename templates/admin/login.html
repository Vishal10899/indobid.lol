{% extends "base.html" %}

{% block title %}Admin Sign In — indobid.lol{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16 sm:py-24">
  <div class="glass-panel rounded-3xl p-8 border border-white/15 shadow-2xl">
    
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center mx-auto mb-4 text-xl">
        🔐
      </div>
      <h1 class="text-2xl font-black text-white tracking-tight">Admin Sign In</h1>
      <p class="text-xs text-zinc-400 mt-1">
        Restricted control center. Normal visitors do not need an account.
      </p>
    </div>

    <form method="POST" action="{{ url_for('admin.login') }}" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">
          Admin Email
        </label>
        <input type="email" id="email" name="email" required placeholder="admin@indobid.lol"
          class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors text-sm">
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">
          Password
        </label>
        <input type="password" id="password" name="password" required placeholder="••••••••••••"
          class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors text-sm">
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full btn-primary py-3 rounded-xl font-bold text-sm tracking-wide">
          Access Dashboard
        </button>
      </div>
    </form>

    <div class="text-center mt-6 pt-4 border-t border-white/5">
      <a href="{{ url_for('main.index') }}" class="text-xs text-zinc-500 hover:text-zinc-300 transition-colors">
        ← Back to Homepage
      </a>
    </div>

  </div>
</div>
{% endblock %}
